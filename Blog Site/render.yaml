databases:
  - name: blog-site-db
    plan: basic-256mb
    databaseName: blog_site
    user: blog_site_user

services:
  - type: web
    name: blog-site
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run db:deploy
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: blog-site-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
