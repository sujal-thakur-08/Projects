<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume - Sujal Thakur</title>
<style>
:root{--accent:#7c3aed;--accent-2:#06b6d4;--muted:#64748b}
*{box-sizing:border-box}
body{
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:linear-gradient(180deg,#f8fafc 0%, #eef2ff 100%);
  color:#0b1220;
  padding:44px;
  -webkit-font-smoothing:antialiased;
}
.card{
  max-width:1100px;
  margin:0 auto;
  display:grid;
  grid-template-columns:280px 1fr;
  gap:34px;
  background:linear-gradient(180deg, rgba(255,255,255,0.97), rgba(250,250,255,0.97));
  padding:36px;
  border-radius:18px;
  box-shadow:0 30px 60px rgba(15,23,42,0.14);
  position:relative;
  overflow:visible;
}
.card::before{
  content:"";
  position:absolute;
  right:-110px;
  top:-80px;
  width:320px;
  height:320px;
  background:radial-gradient(circle at 30% 30%, rgba(124,58,237,0.20), rgba(6,182,212,0.06));
  filter:blur(36px);
  transform:rotate(18deg);
  opacity:0.95;
}
.sidebar{
  background:linear-gradient(180deg,var(--accent),var(--accent-2));
  color:#fff;
  padding:32px 22px;
  border-radius:14px;
  text-align:center;
  align-self:start;
}
.avatar{
  width:110px;height:110px;border-radius:50%;
  background:rgba(255,255,255,0.14);
  margin:0 auto 14px;
  box-shadow:0 8px 22px rgba(12,12,12,0.14) inset;
}
.name{
  font-size:36px;
  margin:8px 0 6px;
  font-weight:900;
  letter-spacing:0.3px;
}
.contact{
  font-size:15px;opacity:0.95;margin-bottom:18px;
}
.section{margin-bottom:16px}
.skills{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.skill{
  background:rgba(255,255,255,0.14);
  color:#fff;padding:10px 14px;border-radius:999px;font-weight:700;font-size:15px;
  box-shadow:0 6px 18px rgba(2,6,23,0.10);
}
.right{padding:6px 8px}
.right h2{
  font-size:18px;margin:0 0 14px;color:#0b1220;font-weight:800;
  display:flex;align-items:center;gap:12px;
}
.right h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-left:14px;border-radius:2px}
.edu p, .achievements li{margin:10px 0;font-size:16px;line-height:1.45}
h2.section-title{font-size:13px;text-transform:uppercase;color:#667085;margin-bottom:10px;letter-spacing:1px}
.footer{font-size:14px;color:var(--muted);margin-top:20px;text-align:right}
@media(max-width:880px){
  .card{grid-template-columns:1fr;padding:20px}
  .sidebar{text-align:left;display:flex;gap:14px;align-items:center}
  .avatar{width:72px;height:72px}
  .name{font-size:22px}
  .skills{justify-content:flex-start}
  .footer{text-align:left}
}
@media print{
  body{background:#fff;padding:0}
  .card{box-shadow:none;border-radius:0}
  .card::before{display:none}
}
</style>
</head>
<body>
<div class="card">
  <aside class="sidebar">
    <div class="avatar" aria-hidden></div>
    <h1 class="name">Sujal Thakur</h1>
    <p class="contact">Chandigarh • sujalthakur2710@gmail.com</p>

    <div class="section">
      <h2>Skills</h2>
      <div class="skills">
        <span class="skill">HTML</span><span class="skill">CSS</span><span class="skill">JS</span><span class="skill">Git</span>
      </div>
    </div>
  </aside>

  <main class="right">
    <section class="section edu">
      <h2>Education</h2>
      <p>Chandigarh University — B.E. — 2023–2027</p>
    </section>

    <section class="section achievements">
      <h2>Achievements</h2>
      <ul>
        <li>Participated in various Hackathons</li>
        <li>Published many project on GitHub</li>
      </ul>
    </section>
  </main>
</div>
</body>
</html>
